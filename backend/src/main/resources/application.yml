spring:
  application:
    name: gestion-locative
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gestion_locative}
    username: ${DB_USER:gestion}
    password: ${DB_PASSWORD:gestion}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:8000,https://martinsson.github.io}
