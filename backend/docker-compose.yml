services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gestion_locative
      POSTGRES_USER: gestion
      POSTGRES_PASSWORD: gestion
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestion -d gestion_locative"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
